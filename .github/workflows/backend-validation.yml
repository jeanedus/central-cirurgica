name: Validate backend schema and migrations

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-validation.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: validation
          POSTGRES_PASSWORD: validation
          POSTGRES_DB: validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U validation -d validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://validation:validation@localhost:5432/validation
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply all migrations to disposable PostgreSQL
        run: npx prisma migrate deploy
      - name: Seed coding systems
        run: npm run db:seed
      - name: Check SIGTAP importer syntax
        run: node --check scripts/import-sigtap.js
      - name: Validate SIGTAP fixed-width fixture without database writes
        run: node scripts/import-sigtap.js scripts/fixtures/sigtap-mini --validate-only
      - name: Build TypeScript
        run: npm run build
